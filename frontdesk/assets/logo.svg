<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Dark Green Logo -->
  <g fill="#1A4D33">
    
    <!-- Ringing Lines Left -->
    <path d="M 60 70 A 50 50 0 0 0 45 105" fill="none" stroke="#1A4D33" stroke-width="6" stroke-linecap="round"/>
    <path d="M 45 60 A 65 65 0 0 0 30 105" fill="none" stroke="#1A4D33" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ringing Lines Right -->
    <path d="M 140 70 A 50 50 0 0 1 155 105" fill="none" stroke="#1A4D33" stroke-width="6" stroke-linecap="round"/>
    <path d="M 155 60 A 65 65 0 0 1 170 105" fill="none" stroke="#1A4D33" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Button -->
    <rect x="92" y="55" width="16" height="15" rx="2"/>
    <rect x="85" y="48" width="30" height="6" rx="3"/>
    
    <!-- Dome Base -->
    <path d="M 50 110 A 50 50 0 0 1 150 110 Z" />
    
    <!-- Dome White Highlights -->
    <path d="M 70 100 A 35 35 0 0 1 100 70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="115" cy="72" r="3" fill="#FFFFFF"/>
    
    <!-- Dome Bottom Rim -->
    <rect x="45" y="112" width="110" height="8" rx="4"/>
    
    <!-- Base Trapezoid -->
    <path d="M 50 125 L 150 125 L 160 145 L 40 145 Z" />
    
    <!-- Base White Highlight Cutouts -->
    <path d="M 60 130 L 90 130 L 85 140 L 55 140 Z" fill="#FFFFFF" />
    <path d="M 95 130 L 140 130 L 140 132 L 95 132 Z" fill="#FFFFFF" />
    
    <!-- Bottom Base Line -->
    <rect x="35" y="148" width="130" height="8" rx="3"/>
    
  </g>
</svg>
